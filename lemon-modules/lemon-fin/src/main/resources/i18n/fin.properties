# AI 问数工具（名称显示给用户；.desc 与参数说明是给模型看的提示词）
fin.ai.tool.receivableAging=应收账龄
fin.ai.tool.receivableAging.desc=查询应收账款余额与账龄（按客户）：每个客户的未核销余额、未到期、已逾期合计及逾期 1-30 / 31-60 / 61-90 / 90 天以上金额，金额单位为元，第一行为合计。用于回答应收余额、客户欠款、逾期应收、账龄结构等问题；只看逾期客户时传 overdueOnly=true（按逾期金额降序）。
fin.ai.tool.payableAging=应付账龄
fin.ai.tool.payableAging.desc=查询应付账款余额与账龄（按供应商）：每个供应商的未核销余额、未到期、已逾期合计及逾期 1-30 / 31-60 / 61-90 / 90 天以上金额，金额单位为元，第一行为合计。用于回答应付余额、欠供应商多少钱、逾期应付等问题。
fin.ai.tool.receiptSummary=回款汇总
fin.ai.tool.receiptSummary.desc=查询日期范围内已生效的收款（回款）按客户汇总：笔数与金额（元），第一行为合计，按金额降序。用于回答某段时间回款多少、哪些客户回款最多等问题。
fin.ai.tool.paymentSummary=付款汇总
fin.ai.tool.paymentSummary.desc=查询日期范围内已生效的付款按供应商汇总：笔数与金额（元），第一行为合计，按金额降序。用于回答某段时间付款多少、付给哪些供应商等问题。
fin.ai.tool.financialStatement=财务报表
fin.ai.tool.financialStatement.desc=查询某会计期间的利润表（report=INCOME，列为本月、本年累计、上年同期累计）或资产负债表（report=BALANCE，列为期末余额、年初余额）的各项目金额（元），最后几行为关键指标（毛利率、营业利润率、净利率、期间费用率，或资产负债率、流动比率、速动比率）。数据来自已记账凭证，用于回答收入、成本、利润、资产、负债等财务问题。
fin.ai.tool.grossMargin=毛利分析
fin.ai.tool.grossMargin.desc=查询日期范围内的销售毛利：按物料、客户或月份汇总的数量、销售收入、销售成本、毛利（元）和毛利率（%），第一行为合计；missingCost 为没有成本的明细行数（这些行的毛利偏高）。用于回答毛利、毛利率、哪些产品或客户最赚钱等问题。
fin.ai.tool.fundBalance=资金余额
fin.ai.tool.fundBalance.desc=查询各现金、银行账户在日期范围内的期初余额、收入、支出、期末余额（元）和收支笔数，第一行为合计。用于回答现在账上有多少钱、银行存款余额、某段时间资金收支等问题；只问当前余额时日期范围用默认值即可（取期末余额）。
fin.ai.param.startDate=开始日期 yyyy-MM-dd，默认本月 1 日
fin.ai.param.endDate=截止日期 yyyy-MM-dd，默认今天
fin.ai.param.period=会计期间 yyyyMM（如 202611），默认本月
fin.ai.param.top=最多返回的行数（不含合计行），默认 20
fin.ai.param.asOf=账龄的截止日期 yyyy-MM-dd，默认今天
fin.ai.param.partnerKeyword=往来单位编码或名称包含的关键字
fin.ai.param.overdueOnly=是否只返回有逾期金额的往来单位
fin.ai.param.report=报表：INCOME 利润表，BALANCE 资产负债表
fin.ai.param.marginGroupBy=汇总维度：MATERIAL 按物料（默认），CUSTOMER 按客户，MONTH 按月份
fin.ai.param.marginSortBy=排序：REVENUE 按收入（默认），PROFIT 按毛利，MARGIN 按毛利率，均为降序

